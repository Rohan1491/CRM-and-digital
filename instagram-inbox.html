<style>
.topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 28px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
.topbar h2 { font-size:18px; font-weight:700; }
.content { padding:24px 28px; flex:1; max-width:900px; }

.tabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--border); }
.tab { padding:9px 16px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; user-select:none; }
.tab.active { color:#6366f1; border-bottom-color:#6366f1; }
.tab .n { color:var(--muted); font-weight:500; }

.btn { padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--text); }
.btn-primary { background:#6366f1; color:#fff; border:none; }
.btn-primary:hover { background:#4f46e5; }
.btn-primary:disabled { background:#c7c9f5; cursor:not-allowed; }
.btn-danger { color:#a3221f; }
.btn-danger:hover { border-color:#a3221f; }
.btn-sm { padding:6px 12px; font-size:12px; }

.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
.card-head { display:flex; align-items:baseline; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.cust-name { font-size:14px; font-weight:700; color:var(--text); }
.cust-handle { font-size:12px; color:var(--muted); }
.kind-badge { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:2px 8px; border-radius:10px; background:#eef2ff; color:#4338ca; }
.time { margin-left:auto; font-size:11px; color:var(--muted); }

.inbound-body { font-size:13.5px; color:var(--text); background:#f8fafc; border-radius:8px; padding:10px 12px; margin-bottom:10px; line-height:1.5; }

.ai-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.ai-badge { font-size:11px; font-weight:600; padding:3px 9px; border-radius:10px; }
.ai-badge.action { background:#e8f8ee; color:#12703b; }
.ai-badge.conf-high { background:#e8f8ee; color:#12703b; }
.ai-badge.conf-low { background:#fef3e2; color:#92610b; }
.ai-reason { font-size:11.5px; color:var(--muted); font-style:italic; }

.reply-box { width:100%; border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:13px; font-family:inherit; resize:vertical; min-height:64px; outline:none; color:var(--text); }
.reply-box:focus { border-color:#6366f1; }
.reply-box:disabled { background:#f8fafc; color:var(--muted); }

.card-actions { display:flex; gap:8px; margin-top:10px; align-items:center; }
.status-pill { font-size:11px; font-weight:700; padding:3px 10px; border-radius:10px; text-transform:uppercase; letter-spacing:.3px; }
.status-pill.sent { background:#e8f8ee; color:#12703b; }
.status-pill.rejected { background:#fdeaea; color:#a3221f; }
.action-note { font-size:12px; color:var(--muted); margin-left:auto; }

.empty { text-align:center; padding:56px 20px; color:var(--muted); font-size:14px; }
.toast { position:fixed; bottom:24px; right:24px; background:#1e293b; color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; font-weight:500; z-index:999; opacity:0; transition:opacity .25s; pointer-events:none; }
.toast.show { opacity:1; }
</style>
</head>

<div class="main">
  <div class="topbar">
    <h2>Instagram Inbox</h2>
    <button class="btn btn-sm" onclick="sessionStorage.removeItem(&quot;arambhika_auth&quot;);location.replace(&quot;login.html&quot;);" title="Sign out">&#9211; Logout</button>
  </div>

  <div class="content">
    <div class="tabs" id="tabs"></div>
    <div id="feed"></div>
  </div>

<div class="toast" id="toast"></div>

<script>
const TABS = [
  { key: 'pending', label: 'Needs review' },
  { key: 'sent', label: 'Sent' },
  { key: 'rejected', label: 'Rejected' },
  { key: '', label: 'All' },
];
let activeTab = 'pending';
let items = [];

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso.replace(' ', 'T') + 'Z');
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.round(hrs / 24) + 'd ago';
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(t =>
    `<div class="tab ${t.key === activeTab ? 'active' : ''}" data-key="${t.key}">${t.label}</div>`
  ).join('');
  document.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => {
    activeTab = el.dataset.key;
    load();
  }));
}

async function load() {
  renderTabs();
  const res = await fetch(`/api/instagram/messages${activeTab ? '?status=' + activeTab : ''}`);
  const body = await res.json();
  items = body.data || [];
  render();
}

function render() {
  const feed = document.getElementById('feed');
  if (!items.length) {
    feed.innerHTML = `<div class="empty">Nothing here. ${activeTab === 'pending' ? 'New Instagram DMs and comments will show up for review as they arrive.' : ''}</div>`;
    return;
  }
  feed.innerHTML = items.map(cardHtml).join('');
}

function cardHtml(m) {
  const confClass = m.ai_confidence === 'high' ? 'conf-high' : 'conf-low';
  const isPending = !m.reply_status;
  const isSent = m.reply_status === 'sent';
  const isRejected = m.reply_status === 'rejected';
  return `
    <div class="card" data-id="${m.id}">
      <div class="card-head">
        <span class="cust-name">${esc(m.customer_name || '(unknown)')}</span>
        <span class="cust-handle">@${esc(m.handle || '?')}</span>
        <span class="kind-badge">${esc(m.kind)}</span>
        <span class="time">${timeAgo(m.created_at)}</span>
      </div>
      <div class="inbound-body">${esc(m.body)}</div>
      <div class="ai-row">
        ${m.ai_action ? `<span class="ai-badge action">${esc(m.ai_action)}</span>` : ''}
        ${m.ai_confidence ? `<span class="ai-badge ${confClass}">confidence: ${esc(m.ai_confidence)}</span>` : ''}
      </div>
      ${m.ai_reasoning ? `<div class="ai-reason">${esc(m.ai_reasoning)}</div>` : ''}
      <textarea class="reply-box" data-id="${m.id}" ${isPending ? '' : 'disabled'} placeholder="No draft — write a reply to send one">${esc(isSent ? '' : m.ai_reply)}</textarea>
      <div class="card-actions">
        ${isPending ? `
          <button class="btn btn-primary btn-sm" onclick="approve(${m.id})">Approve &amp; Send</button>
          <button class="btn btn-danger btn-sm" onclick="reject(${m.id})">Reject</button>
        ` : ''}
        ${isSent ? `<span class="status-pill sent">Sent ${timeAgo(m.replied_at)}</span>` : ''}
        ${isRejected ? `<span class="status-pill rejected">Rejected</span>` : ''}
        <span class="action-note" id="note-${m.id}"></span>
      </div>
    </div>
  `;
}

async function approve(id) {
  const textEl = document.querySelector(`.reply-box[data-id="${id}"]`);
  const text = textEl.value.trim();
  if (!text) { toast('Nothing to send', 'error'); return; }
  const note = document.getElementById(`note-${id}`);
  note.textContent = 'Sending…';
  try {
    const res = await fetch(`/api/instagram/messages/${id}/approve`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ text, author: window.__AUTH?.name || 'Rohan' }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Send failed');
    toast('Reply sent');
    load();
  } catch (e) { note.textContent = ''; toast(e.message, 'error'); }
}

async function reject(id) {
  try {
    await fetch(`/api/instagram/messages/${id}/reject`, { method: 'POST' });
    toast('Marked as rejected');
    load();
  } catch (e) { toast('Failed', 'error'); }
}

function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = type ? `show ${type}` : 'show';
  setTimeout(() => el.className = '', 2500);
}

load();
</script>
