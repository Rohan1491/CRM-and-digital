<style>
.topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 28px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
.topbar h2 { font-size:18px; font-weight:700; }
.content { padding:24px 28px; flex:1; }

.toolbar { display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.search-bar { background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:13px; font-family:inherit; width:240px; outline:none; }
.search-bar:focus { border-color:#6366f1; }
.count-badge { font-size:12px; color:var(--muted); }

.btn { padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:6px; background:var(--surface); color:var(--text); border:1px solid var(--border); }
.btn-primary { background:#6366f1; color:#fff; border:none; }
.btn-primary:hover { background:#4f46e5; }
.btn:hover { border-color:#6366f1; color:#6366f1; }
.btn-sm { padding:5px 10px; font-size:12px; }

.cat-block { margin-bottom:24px; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#fff; }
.cat-head { display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--border); cursor:pointer; user-select:none; }
.cat-head:hover { background:#eef2ff; }
.cat-name { font-size:13px; font-weight:700; flex:1; color:var(--text); }
.cat-count { font-size:11px; color:var(--muted); }
.cat-chevron { font-size:11px; color:var(--muted); transition:transform .2s; }
.cat-block.collapsed .cat-chevron { transform:rotate(-90deg); }
.cat-block.collapsed .cat-body { display:none; }
.cat-body { overflow-x:auto; }

table { width:100%; border-collapse:collapse; }
thead th { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; padding:8px 12px; text-align:left; border-bottom:1px solid var(--border); background:var(--surface); }
tbody tr { border-bottom:1px solid #f1f5f9; }
tbody tr:last-child { border-bottom:none; }
tbody tr:hover { background:#f8fafc; }
td { padding:10px 12px; font-size:13px; color:var(--text); }
td.muted { color:var(--muted); font-size:12px; }

.badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:600; }
.badge.ok { background:#e8f8ee; color:#12703b; }
.badge.out { background:#fdeaea; color:#a3221f; }

.adjust-controls { display:flex; gap:6px; align-items:center; }
.delta-input { width:70px; border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:12px; font-family:inherit; outline:none; }
.reason-select { border:1px solid var(--border); border-radius:6px; padding:5px 6px; font-size:12px; font-family:inherit; outline:none; }

.status-text { font-size:12px; margin-left:8px; }
.status-text.success { color:#12703b; }
.status-text.error { color:#a3221f; }

.empty { text-align:center; padding:48px; color:var(--muted); font-size:14px; }
.toast { position:fixed; bottom:24px; right:24px; background:#1e293b; color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; font-weight:500; z-index:999; opacity:0; transition:opacity .25s; pointer-events:none; }
.toast.show { opacity:1; }

.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1000; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal { background:#fff; border-radius:12px; width:560px; max-height:80vh; display:flex; flex-direction:column; overflow:hidden; }
.modal-head { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal-head h3 { font-size:15px; font-weight:700; }
.modal-close { background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted); line-height:1; }
.modal-body { padding:14px 20px; overflow-y:auto; }
.pick-search { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; outline:none; margin-bottom:12px; }
.pick-row { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid #f1f5f9; }
.pick-row:last-child { border-bottom:none; }
.pick-name { flex:1; font-size:13px; }
.pick-sku { color:var(--muted); font-size:11px; }
</style>
</head>

<div class="sidebar-overlay" id="sbOverlay" onclick="document.querySelector(&quot;.sidebar&quot;).classList.remove(&quot;open&quot;);this.classList.remove(&quot;show&quot;)"></div>

<div class="main">
  <div class="topbar">
    <h2>Inventory</h2>
    <div class="toolbar" style="margin:0">
      <input type="text" class="search-bar" id="searchBox" placeholder="Search by SKU, name or category..." oninput="renderProducts()">
      <span class="count-badge" id="productCount"></span>
      <button class="btn btn-primary btn-sm" onclick="openAddInventoryModal()">+ Add to Inventory</button>
      <button class="btn btn-outline btn-sm" onclick="sessionStorage.removeItem(&quot;arambhika_auth&quot;);location.replace(&quot;login.html&quot;);" title="Sign out">&#9211; Logout</button>
    </div>
  </div>

  <div class="content">
    <div id="productsContainer"></div>
  </div>
</div>

<!-- Add to Inventory picker: lists products from the catalog (Products page)
     not yet inventory-tracked (flag_for_website=1) -->
<div class="modal-overlay" id="addInvModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Add to Inventory</h3>
      <button class="modal-close" onclick="closeAddInventoryModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="text" class="pick-search" id="pickSearch" placeholder="Search products not yet in inventory..." oninput="renderPickList()">
      <div id="pickList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ADJUST_REASONS = ["Stock received", "Correction", "Damaged / Lost", "Manual dispatch", "Other"];
const collapsedCats = {};
let allProducts = [];

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadProducts() {
  const res = await fetch('/api/products');
  const body = await res.json();
  allProducts = body.data || [];
  renderProducts();
}

function stockStatus(p) {
  if ((p.quantity || 0) <= 0) return { label: 'Out of stock', cls: 'out' };
  return { label: 'In stock', cls: 'ok' };
}

// Same fixed display order as the standalone inventory app's CATEGORY_ORDER.
// Unlisted categories sort alphabetically after these, so a new category
// never silently disappears from the page.
const CATEGORY_ORDER = [
  'Nickel Strip Plated',
  'Nickel Strip Pure',
  'Nickel Strip Pure Custom',
  'Copper Busbar',
  'Cell LFP',
  'Cell Li-ion',
  'Cell Prismatic',
  'Aluminium Busbar',
];

function groupByCategory(products) {
  const map = {};
  for (const p of products) {
    const cat = p.category || '(uncategorized)';
    if (!map[cat]) map[cat] = [];
    map[cat].push(p);
  }
  const order = Object.keys(map).sort((a, b) => {
    const ra = CATEGORY_ORDER.indexOf(a), rb = CATEGORY_ORDER.indexOf(b);
    const rankA = ra === -1 ? CATEGORY_ORDER.length : ra;
    const rankB = rb === -1 ? CATEGORY_ORDER.length : rb;
    if (rankA !== rankB) return rankA - rankB;
    return a.localeCompare(b);
  });
  return { order, map };
}

function productRowHtml(p) {
  const status = stockStatus(p);
  const reasonOptions = ADJUST_REASONS.map(r => `<option value="${esc(r)}" ${r === 'Stock received' ? 'selected' : ''}>${esc(r)}</option>`).join('');
  return `
    <tr>
      <td>${esc(p.sku)}</td>
      <td>${esc(p.name)}</td>
      <td>${p.quantity ?? 0}</td>
      <td><span class="badge ${status.cls}">${status.label}</span></td>
      <td>
        <div class="adjust-controls">
          <input type="number" class="delta-input" data-id="${p.id}" step="any" placeholder="+/- qty">
          <select class="reason-select" data-id="${p.id}">${reasonOptions}</select>
          <button class="btn btn-sm" onclick="saveInlineAdjust(${p.id})">Save</button>
        </div>
        <span class="status-text row-status" data-id="${p.id}"></span>
      </td>
    </tr>
  `;
}

function renderProducts() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  // Inventory only shows products actually being stock-tracked — anything
  // flagged For Website (not yet added / on-request) is excluded, and only
  // shows up again once "Added to Inventory" below flips that flag.
  const tracked = allProducts.filter(p => !p.flag_for_website);
  const filtered = tracked.filter(p =>
    !q || (p.sku||'').toLowerCase().includes(q) || (p.name||'').toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q)
  );

  const container = document.getElementById('productsContainer');
  const { order, map } = groupByCategory(filtered);

  let html = '';
  for (const cat of order) {
    const items = map[cat];
    const collapsed = collapsedCats[cat] ? ' collapsed' : '';
    html += `<div class="cat-block${collapsed}">`;
    html += `<div class="cat-head" onclick="toggleCat('${cat.replace(/'/g,"\\'")}')">`;
    html += `<span class="cat-name">${esc(cat)}</span>`;
    html += `<span class="cat-count">${items.length} product${items.length===1?'':'s'}</span>`;
    html += `<span class="cat-chevron">&#9660;</span></div>`;
    html += `<div class="cat-body"><table><thead><tr><th>SKU</th><th>Name</th><th>In Stock</th><th>Status</th><th>Adjust stock</th></tr></thead><tbody>`;
    html += items.map(productRowHtml).join('');
    html += `</tbody></table></div></div>`;
  }
  container.innerHTML = html || '<div class="empty">No products found.</div>';
  document.getElementById('productCount').textContent = `${filtered.length} of ${tracked.length} products`;
}

function openAddInventoryModal() {
  document.getElementById('pickSearch').value = '';
  document.getElementById('addInvModal').classList.add('open');
  renderPickList();
}

function closeAddInventoryModal() {
  document.getElementById('addInvModal').classList.remove('open');
}

function renderPickList() {
  const q = document.getElementById('pickSearch').value.trim().toLowerCase();
  const candidates = allProducts
    .filter(p => p.flag_for_website)
    .filter(p => !q || (p.sku||'').toLowerCase().includes(q) || (p.name||'').toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q));

  const list = document.getElementById('pickList');
  if (!candidates.length) {
    list.innerHTML = '<div class="empty">No products found — everything matching is already in inventory.</div>';
    return;
  }
  list.innerHTML = candidates.map(p => `
    <div class="pick-row">
      <div class="pick-name">${esc(p.name)}<br><span class="pick-sku">${esc(p.sku)} · ${esc(p.category||'')}</span></div>
      <button class="btn btn-primary btn-sm" onclick="addToInventory(${p.id})">Add</button>
    </div>
  `).join('');
}

async function addToInventory(productId) {
  try {
    const res = await fetch(`/api/products/${productId}/flags`, {
      method: 'PATCH', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ flag_for_website: 0 }),
    });
    if (!res.ok) throw new Error('Failed');
    await loadProducts();
    renderPickList();
    toast('Added to inventory');
  } catch(e) { toast('Failed to add', 'error'); }
}

function toggleCat(cat) {
  collapsedCats[cat] = !collapsedCats[cat];
  renderProducts();
}

async function saveInlineAdjust(productId) {
  const deltaInput = document.querySelector(`.delta-input[data-id="${productId}"]`);
  const reasonSelect = document.querySelector(`.reason-select[data-id="${productId}"]`);
  const statusEl = document.querySelector(`.row-status[data-id="${productId}"]`);
  const delta = parseFloat(deltaInput.value);
  if (Number.isNaN(delta) || delta === 0) {
    statusEl.textContent = 'Enter a non-zero number.'; statusEl.className = 'status-text error row-status'; return;
  }
  try {
    const res = await fetch(`/api/products/${productId}/adjust-stock`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ delta, reason: reasonSelect.value }),
    });
    const data = await res.json();
    if (!res.ok) { statusEl.textContent = data.error || 'Failed.'; statusEl.className = 'status-text error row-status'; return; }
    toast('Stock updated');
    await loadProducts();
  } catch(e) { statusEl.textContent = 'Failed to update stock.'; statusEl.className = 'status-text error row-status'; }
}

function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = type ? `show ${type}` : 'show';
  setTimeout(() => el.className = '', 2500);
}

loadProducts();
</script>
<script src="js/nav.js"></script>
